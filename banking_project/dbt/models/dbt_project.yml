name: 'banking_project'
version: '1.0.0'
config-version: 2

profile: 'banking_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  banking_project:
    staging:
      +materialized: table
      +schema: staging

    marts:
      dimensions:
        +materialized: table
        +schema: marts

      facts:
        +materialized: table
        +schema: marts

      analytics:
        +materialized: table
        +schema: analytics